# Free Supabase projects pause after a week without traffic. This pings the
# sync database every three days so it stays awake even when the app isn't opened.
name: Keep database awake
on:
  schedule:
    - cron: '17 3 */3 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping
        run: |
          curl -fsS -X POST "https://knlzfpcqnyjcykimrzie.supabase.co/rest/v1/rpc/cd_ping" \
            -H "apikey: sb_publishable__RBErbKWTihX1FTFJP1fsA_qtVKFgjj" \
            -H "Content-Type: application/json" -d '{}'
